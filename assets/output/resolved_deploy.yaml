async_chunk: false
connectors:
  connector_of_shared_memory:
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      initial_codec_chunk_frames: 4
    name: SharedMemoryConnector
platforms:
  cuda:
    stages:
    - compilation_config:
        custom_ops:
        - +rotary_embedding
      stage_id: 0
  musa:
    stages:
    - hf_overrides:
        quantization_config: null
      stage_id: 1
    - hf_overrides:
        quantization_config: null
      stage_id: 2
  npu:
    stages:
    - compilation_config:
        cudagraph_mode: PIECEWISE
      devices: 0,1
      gpu_memory_utilization: 0.6
      max_num_batched_tokens: 8192
      stage_id: 0
      tensor_parallel_size: 2
    - compilation_config:
        cudagraph_mode: PIECEWISE
      devices: '2'
      gpu_memory_utilization: 0.6
      max_num_batched_tokens: 8192
      stage_id: 1
    - compilation_config:
        cudagraph_mode: PIECEWISE
      devices: '2'
      gpu_memory_utilization: 0.3
      stage_id: 2
  rocm:
    stages:
    - enforce_eager: true
      stage_id: 2
  xpu:
    stages:
    - devices: 0,1,2,3
      enforce_eager: true
      max_cudagraph_capture_size: 0
      stage_id: 0
      tensor_parallel_size: 4
    - devices: '4'
      enforce_eager: true
      max_cudagraph_capture_size: 0
      stage_id: 1
    - devices: '4'
      enforce_eager: true
      gpu_memory_utilization: 0.3
      max_cudagraph_capture_size: 0
      stage_id: 2
stages:
- default_sampling_params:
    max_tokens: 2048
    temperature: 0.0
  devices: 0,1
  disable_custom_all_reduce: true
  enable_prefix_caching: false
  enforce_eager: true
  gpu_memory_utilization: 0.85
  limit_mm_per_prompt:
    audio: 1
    image: 1
    video: 0
  max_model_len: 4096
  max_num_batched_tokens: 4096
  max_num_seqs: 1
  moe_backend: triton
  stage_id: 0
  tensor_parallel_size: 2
  trust_remote_code: true
- default_sampling_params:
    max_tokens: 4096
    repetition_penalty: 1.05
    seed: 42
    temperature: 0.9
    top_k: 50
  devices: '2'
  enable_prefix_caching: false
  enforce_eager: true
  gpu_memory_utilization: 0.8
  input_connectors:
    from_stage_0: connector_of_shared_memory
  max_num_batched_tokens: 32768
  max_num_seqs: 1
  moe_backend: triton
  stage_id: 1
  tensor_parallel_size: 1
  trust_remote_code: true
- async_scheduling: false
  default_sampling_params:
    max_tokens: 65536
    repetition_penalty: 1.1
    temperature: 0.0
    top_k: -1
    top_p: 1.0
  devices: '3'
  enable_chunked_prefill: false
  enable_prefix_caching: false
  enforce_eager: false
  gpu_memory_utilization: 0.8
  input_connectors:
    from_stage_1: connector_of_shared_memory
  max_num_batched_tokens: 65536
  max_num_seqs: 1
  stage_id: 2
  tensor_parallel_size: 1
  trust_remote_code: true
